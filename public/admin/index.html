<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#07111f" />
    <title>内容管理工作台 · Junjie Xu</title>
    <style>
      :root {
        --bg: #060d18;
        --surface: rgba(255, 255, 255, 0.035);
        --surface-strong: rgba(255, 255, 255, 0.06);
        --line: rgba(178, 205, 235, 0.14);
        --line-strong: rgba(178, 205, 235, 0.28);
        --ink: #f0f6ff;
        --ink-secondary: #c3d2e4;
        --ink-tertiary: #8fa1b8;
        --accent: #6fb3ff;
        --accent-soft: rgba(111, 179, 255, 0.14);
        --danger: #ff8b72;
        --success: #5fd8ae;
        --radius-l: 22px;
        --radius-m: 12px;
        --radius-s: 9px;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        background:
          radial-gradient(1100px 500px at 18% -8%, rgba(63, 125, 196, 0.16), transparent 60%),
          radial-gradient(900px 600px at 108% 32%, rgba(66, 170, 148, 0.08), transparent 55%),
          var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      [hidden] { display: none !important; }

      ::selection { background: rgba(111, 179, 255, 0.35); }

      button { font: inherit; color: inherit; cursor: pointer; }
      input, textarea { font: inherit; color: inherit; }

      .login-stage {
        display: grid;
        min-height: 100svh;
        place-items: center;
        padding: 32px 20px;
      }

      .login-card {
        width: min(440px, 100%);
        padding: 44px 40px 36px;
        border: 1px solid var(--line);
        border-radius: var(--radius-l);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
        backdrop-filter: blur(44px) saturate(140%);
        -webkit-backdrop-filter: blur(44px) saturate(140%);
        box-shadow: 0 40px 120px rgba(1, 6, 14, 0.55);
        animation: rise 640ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(18px) scale(0.985); }
        to { opacity: 1; transform: none; }
      }

      .login-mark {
        display: grid;
        width: 46px;
        height: 46px;
        margin-bottom: 26px;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(145deg, #7db8ff, #4a86d8);
        color: #04101f;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.02em;
        box-shadow: 0 10px 28px rgba(84, 145, 214, 0.35);
      }

      .login-card h1 {
        margin: 0;
        font-size: 25px;
        font-weight: 650;
        letter-spacing: -0.015em;
      }

      .login-sub {
        margin: 8px 0 30px;
        color: var(--ink-tertiary);
        font-size: 13.5px;
      }

      .field { margin-bottom: 16px; }

      .field label {
        display: block;
        margin-bottom: 7px;
        color: var(--ink-tertiary);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .field input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-s);
        outline: 0;
        background: rgba(3, 10, 20, 0.55);
        transition: border-color 180ms ease, box-shadow 180ms ease, background-color 180ms ease;
      }

      .field input:focus {
        border-color: var(--accent);
        background: rgba(6, 18, 34, 0.85);
        box-shadow: 0 0 0 4px rgba(111, 179, 255, 0.16);
      }

      .login-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 4px 0 24px;
        color: var(--ink-tertiary);
        font-size: 13px;
      }

      .check {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        user-select: none;
      }

      .check input {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
      }

      .btn-primary {
        display: inline-flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 18px;
        border: 0;
        border-radius: var(--radius-s);
        background: linear-gradient(180deg, #7cb6ff, #558fe0);
        color: #04101f;
        font-size: 14.5px;
        font-weight: 650;
        transition: transform 140ms ease, filter 160ms ease, box-shadow 160ms ease;
        box-shadow: 0 10px 26px rgba(90, 148, 214, 0.28);
      }

      .btn-primary:hover { filter: brightness(1.07); }
      .btn-primary:active { transform: scale(0.98); }
      .btn-primary:disabled { opacity: 0.55; cursor: wait; }

      .login-help {
        margin: 26px 0 0;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--ink-tertiary);
        font-size: 12.5px;
        line-height: 1.65;
      }

      .login-help a { color: var(--accent); text-decoration: none; }
      .login-help a:hover { text-decoration: underline; }

      .notice {
        margin: 0 0 18px;
        padding: 11px 14px;
        border-radius: var(--radius-s);
        font-size: 13px;
        line-height: 1.5;
      }

      .notice[data-kind="error"] {
        border: 1px solid rgba(255, 139, 114, 0.4);
        background: rgba(255, 139, 114, 0.1);
        color: #ffb4a2;
      }

      .notice[data-kind="success"] {
        border: 1px solid rgba(95, 216, 174, 0.4);
        background: rgba(95, 216, 174, 0.1);
        color: var(--success);
      }

      /* ---------- editor shell ---------- */

      .shell {
        display: flex;
        flex-direction: column;
        min-height: 100svh;
      }

      .topbar {
        position: sticky;
        z-index: 10;
        top: 0;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 28px;
        border-bottom: 1px solid var(--line);
        background: rgba(6, 13, 24, 0.72);
        backdrop-filter: blur(30px) saturate(140%);
        -webkit-backdrop-filter: blur(30px) saturate(140%);
      }

      .topbar-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 10px;
        background: linear-gradient(145deg, #7db8ff, #4a86d8);
        color: #04101f;
        font-size: 14px;
        font-weight: 700;
      }

      .topbar-title {
        flex: 1;
        min-width: 0;
      }

      .topbar-title strong {
        display: block;
        font-size: 15px;
        font-weight: 620;
        letter-spacing: -0.01em;
      }

      .topbar-title span {
        display: block;
        overflow: hidden;
        color: var(--ink-tertiary);
        font-size: 11.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .btn-ghost {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 14px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: transparent;
        font-size: 13px;
        font-weight: 550;
        transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease, transform 140ms ease;
      }

      .btn-ghost:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--ink);
      }

      .btn-ghost:active { transform: scale(0.97); }

      .workbench {
        display: grid;
        flex: 1;
        grid-template-columns: 336px minmax(0, 1fr);
        gap: 26px;
        width: min(1240px, 100%);
        margin: 0 auto;
        padding: 30px 28px 40px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius-l);
        background: var(--surface);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        box-shadow: 0 24px 80px rgba(1, 6, 14, 0.35);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 620;
        letter-spacing: -0.01em;
      }

      .panel-head .count {
        color: var(--ink-tertiary);
        font-size: 12px;
      }

      .btn-new {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        border: 0;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12.5px;
        font-weight: 620;
        transition: background-color 160ms ease, transform 140ms ease;
      }

      .btn-new:hover { background: rgba(111, 179, 255, 0.24); }
      .btn-new:active { transform: scale(0.96); }

      .article-list {
        max-height: calc(100svh - 220px);
        margin: 0;
        padding: 8px;
        overflow-y: auto;
        list-style: none;
      }

      .article-item {
        display: block;
        width: 100%;
        padding: 13px 14px;
        border: 0;
        border-radius: var(--radius-m);
        background: transparent;
        text-align: left;
        transition: background-color 150ms ease;
      }

      .article-item:hover { background: var(--surface-strong); }

      .article-item.is-selected {
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px rgba(111, 179, 255, 0.35);
      }

      .article-item-title {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 13.5px;
        font-weight: 570;
        line-height: 1.4;
      }

      .article-item-title span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .badge {
        flex: 0 0 auto;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(255, 139, 114, 0.16);
        color: #ff9f8a;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .article-item-meta {
        margin: 5px 0 0;
        color: var(--ink-tertiary);
        font-size: 11.5px;
      }

      /* ---------- form ---------- */

      .editor-panel { padding-bottom: 8px; }

      .form-body { padding: 22px 24px 10px; }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px 16px;
      }

      .form-field { display: grid; gap: 6px; min-width: 0; }

      .form-field.span-2 { grid-column: 1 / -1; }

      .form-field label {
        color: var(--ink-tertiary);
        font-size: 11.5px;
        font-weight: 620;
        letter-spacing: 0.02em;
      }

      .form-field label small { margin-left: 5px; font-weight: 480; opacity: 0.75; }

      .form-field input,
      .form-field textarea {
        width: 100%;
        min-width: 0;
        padding: 10px 13px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-s);
        outline: 0;
        background: rgba(3, 10, 20, 0.5);
        font-size: 13.5px;
        transition: border-color 180ms ease, box-shadow 180ms ease;
      }

      .form-field textarea { resize: vertical; line-height: 1.7; }

      .body-toolbar {
        display: flex;
        gap: 8px;
      }

      .tool-btn {
        padding: 5px 12px;
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        background: transparent;
        color: var(--ink-secondary);
        font-size: 12px;
        font-weight: 570;
        transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease;
      }

      .tool-btn:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--ink);
      }

      .body-preview {
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        background: rgba(3, 10, 20, 0.5);
        min-height: 120px;
        max-height: 420px;
        overflow-y: auto;
        color: var(--ink-secondary);
        font-size: 13.5px;
        line-height: 1.75;
      }

      .body-preview img {
        display: block;
        max-width: 100%;
        margin: 10px 0;
        border-radius: var(--radius-s);
      }

      .body-preview h4 { margin: 14px 0 6px; color: var(--ink); }

      .body-preview blockquote {
        margin: 10px 0;
        padding: 4px 14px;
        border-left: 3px solid var(--accent);
      }

      .body-preview code {
        padding: 1px 5px;
        border-radius: 5px;
        background: rgba(111, 179, 255, 0.12);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
      }

      .body-preview a { color: var(--accent); }

      .form-field input:focus,
      .form-field textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(111, 179, 255, 0.14);
      }

      .form-field input::placeholder,
      .form-field textarea::placeholder { color: rgba(143, 161, 184, 0.55); }

      .form-field.checkbox-row {
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 9px;
      }

      .form-field.checkbox-row label { font-size: 12.5px; }

      .form-field.checkbox-row input {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: var(--accent);
      }

      .form-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 16px 24px 20px;
        border-top: 1px solid var(--line);
      }

      .btn-danger-ghost {
        margin-right: auto;
        padding: 9px 15px;
        border: 1px solid rgba(255, 139, 114, 0.4);
        border-radius: var(--radius-s);
        background: transparent;
        color: var(--danger);
        font-size: 13px;
        font-weight: 570;
        transition: background-color 160ms ease, transform 140ms ease;
      }

      .btn-danger-ghost:hover { background: rgba(255, 139, 114, 0.1); }
      .btn-danger-ghost:active { transform: scale(0.97); }

      .status-line {
        flex: 1;
        min-width: 200px;
        color: var(--ink-tertiary);
        font-size: 12.5px;
        text-align: right;
      }

      .status-line[data-kind="error"] { color: #ffb4a2; }
      .status-line[data-kind="success"] { color: var(--success); }
      .status-line a { color: var(--accent); }

      .save-btn {
        padding: 11px 26px;
        border: 0;
        border-radius: var(--radius-s);
        background: linear-gradient(180deg, #7cb6ff, #558fe0);
        color: #04101f;
        font-size: 14px;
        font-weight: 650;
        box-shadow: 0 10px 26px rgba(90, 148, 214, 0.3);
        transition: filter 160ms ease, transform 140ms ease;
      }

      .save-btn:hover { filter: brightness(1.07); }
      .save-btn:active { transform: scale(0.98); }
      .save-btn:disabled { opacity: 0.55; cursor: wait; }

      .empty-hint {
        padding: 60px 24px;
        color: var(--ink-tertiary);
        font-size: 13.5px;
        text-align: center;
      }

      @media (max-width: 900px) {
        .workbench { grid-template-columns: minmax(0, 1fr); padding: 20px 16px 32px; }

        .article-list { max-height: 300px; }

        .form-grid { grid-template-columns: minmax(0, 1fr); }

        .form-foot { align-items: stretch; flex-direction: column; }

        .status-line { text-align: left; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ============ 登录视图 ============ -->
    <section class="login-stage" id="view-login">
      <div class="login-card">
        <div class="login-mark" aria-hidden="true">JX</div>
        <h1>内容管理工作台</h1>
        <p class="login-sub">登录后即可在线撰写与发布工作记录，保存后自动部署到公开站点。</p>
        <div class="notice" id="login-notice" data-kind="error" hidden></div>

        <form id="login-form">
          <div class="field">
            <label for="login-user">GitHub 账号</label>
            <input id="login-user" name="user" autocomplete="username" spellcheck="false" placeholder="AndreJJXu" required />
          </div>
          <div class="field">
            <label for="login-token">访问令牌（密码）</label>
            <input id="login-token" name="token" type="password" autocomplete="current-password" placeholder="ghp_… 或 github_pat_…" required />
          </div>
          <div class="login-row">
            <label class="check"><input type="checkbox" id="remember" /> 在此浏览器记住我</label>
          </div>
          <button class="btn-primary" type="submit" id="login-submit">登录</button>
        </form>

        <p class="login-help">
          令牌需要对这个仓库的 <strong>Contents</strong> 具有读写权限：<a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noreferrer noopener">创建细粒度令牌</a>，
          Repository access 选 <code>AndreJJXu/AndreJJXu.github.io</code>，权限选 Contents → Read and write。
          令牌只保存在此浏览器，仅发送至 api.github.com。
        </p>
      </div>
    </section>

    <!-- ============ 编辑视图 ============ -->
    <div class="shell" id="view-editor" hidden>
      <header class="topbar">
        <div class="topbar-mark" aria-hidden="true">JX</div>
        <div class="topbar-title">
          <strong>内容管理工作台</strong>
          <span id="who">—</span>
        </div>
        <button class="btn-ghost" type="button" id="reload-btn">↻ 重新加载</button>
        <button class="btn-ghost" type="button" id="logout-btn">退出登录</button>
      </header>

      <div class="workbench">
        <section class="panel">
          <div class="panel-head">
            <h2>工作记录</h2>
            <span class="count" id="list-count"></span>
            <button class="btn-new" type="button" id="new-btn">＋ 新文章</button>
          </div>
          <ul class="article-list" id="article-list"></ul>
        </section>

        <section class="panel editor-panel">
          <form id="editor-form" novalidate>
            <div class="form-body">
              <div class="form-grid">
                <div class="form-field span-2">
                  <label for="f-title">中文标题</label>
                  <input id="f-title" required placeholder="文章标题" />
                </div>
                <div class="form-field span-2">
                  <label for="f-title-en">英文标题 <small>可选</small></label>
                  <input id="f-title-en" placeholder="English title" />
                </div>
                <div class="form-field">
                  <label for="f-date">日期</label>
                  <input id="f-date" required placeholder="2026.09" pattern="\d{4}\.\d{2}" title="格式：YYYY.MM" />
                </div>
                <div class="form-field">
                  <label for="f-read">阅读时长</label>
                  <input id="f-read" required placeholder="5 min read" />
                </div>
                <div class="form-field span-2">
                  <label for="f-tags">标签 <small>英文逗号分隔</small></label>
                  <input id="f-tags" required placeholder="Project Log, Music-to-Image" />
                </div>
                <div class="form-field span-2">
                  <label for="f-summary">中文摘要</label>
                  <textarea id="f-summary" rows="3" required placeholder="一两句话概括这篇文章"></textarea>
                </div>
                <div class="form-field span-2">
                  <label for="f-summary-en">英文摘要 <small>可选</small></label>
                  <textarea id="f-summary-en" rows="3" placeholder="English summary"></textarea>
                </div>
                <div class="form-field span-2">
                  <label for="f-body">中文正文 <small>支持 Markdown · 可直接粘贴或拖入图片</small></label>
                  <div class="body-toolbar">
                    <button type="button" class="tool-btn" data-body-action="image" data-target="f-body">图片</button>
                    <button type="button" class="tool-btn" data-body-action="preview" data-target="f-body">预览</button>
                  </div>
                  <textarea id="f-body" rows="10" placeholder="支持 Markdown：## 小标题、**加粗**、[链接](网址)、![图片说明](图片地址)&#10;截图后直接 ⌘V 粘贴，或把图片文件拖进这里，会自动上传并插入"></textarea>
                  <div class="body-preview" id="f-body-preview" hidden></div>
                </div>
                <div class="form-field span-2">
                  <label for="f-body-en">英文正文 <small>可选 · Markdown</small></label>
                  <div class="body-toolbar">
                    <button type="button" class="tool-btn" data-body-action="image" data-target="f-body-en">Image</button>
                    <button type="button" class="tool-btn" data-body-action="preview" data-target="f-body-en">Preview</button>
                  </div>
                  <textarea id="f-body-en" rows="10" placeholder="English body in Markdown — optional"></textarea>
                  <div class="body-preview" id="f-body-en-preview" hidden></div>
                </div>
                <input type="file" id="image-input" accept="image/*" hidden />
                <div class="form-field span-2 checkbox-row">
                  <input type="checkbox" id="f-featured" />
                  <label for="f-featured">设为精选（置顶大卡片，全站仅一篇）</label>
                </div>
              </div>
            </div>
            <div class="form-foot">
              <button class="btn-danger-ghost" type="button" id="delete-btn" hidden>删除这篇文章</button>
              <p class="status-line" id="status-line"></p>
              <button class="save-btn" type="submit" id="save-btn">保存并发布</button>
            </div>
          </form>
          <p class="empty-hint" id="empty-hint" hidden>从左侧选择一篇文章，或点击「新文章」开始写作。</p>
        </section>
      </div>
    </div>

    <script>
      const REPO = "AndreJJXu/AndreJJXu.github.io";
      const CONTENT_PATH = "content/published.json";
      const BRANCH = "main";
      const STORAGE_KEY = "portfolio-admin:session";

      const state = {
        token: "",
        login: "",
        sha: "",
        data: null,
        selectedId: "",
        dirty: false,
      };

      const $ = (id) => document.getElementById(id);
      const loginView = $("view-login");
      const editorView = $("view-editor");

      const b64encode = (text) =>
        btoa(String.fromCharCode(...new TextEncoder().encode(text)));
      const b64decode = (b64) =>
        new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));

      const slugify = (value) =>
        String(value || "")
          .toLowerCase()
          .replace(/['’]/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
          .slice(0, 60);

      function setStatus(message, kind = "") {
        const line = $("status-line");
        line.textContent = message;
        line.dataset.kind = kind;
      }

      function setLoginNotice(message) {
        const notice = $("login-notice");
        notice.textContent = message;
        notice.hidden = !message;
      }

      async function api(path, options = {}) {
        const response = await fetch(`https://api.github.com${path}`, {
          ...options,
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${state.token}`,
            "X-GitHub-Api-Version": "2022-11-28",
            ...(options.body ? { "Content-Type": "application/json" } : {}),
            ...options.headers,
          },
        });
        if (!response.ok) {
          const detail = await response.json().catch(() => ({}));
          const error = new Error(detail.message || `GitHub API ${response.status}`);
          error.status = response.status;
          throw error;
        }
        return response.status === 204 ? null : response.json();
      }

      /* ---------- 登录 ---------- */

      async function handleLogin(event) {
        event.preventDefault();
        const user = $("login-user").value.trim();
        const token = $("login-token").value.trim();
        if (!user || !token) return;

        const button = $("login-submit");
        button.disabled = true;
        setLoginNotice("");
        state.token = token;

        try {
          const me = await api("/user");
          if (me.login.toLowerCase() !== user.toLowerCase()) {
            throw new Error(`令牌属于账号 ${me.login}，与输入的 ${user} 不一致。`);
          }
          const repo = await api(`/repos/${REPO}`);
          if (!repo.permissions?.push) {
            throw new Error("此令牌没有该仓库的写入权限，请检查 Contents 权限设置。");
          }
          state.login = me.login;
          if ($("remember").checked) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ login: me.login, token }));
          } else {
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ login: me.login, token }));
          }
          await enterEditor();
        } catch (error) {
          if (error.status === 401) {
            setLoginNotice("令牌无效或已过期，请重新生成后重试。");
          } else {
            setLoginNotice(error.message);
          }
        } finally {
          button.disabled = false;
        }
      }

      async function enterEditor() {
        loginView.hidden = true;
        editorView.hidden = false;
        $("who").textContent = `${state.login} · ${REPO}`;
        await loadContent();
      }

      /* ---------- 内容加载 ---------- */

      async function loadContent() {
        setStatus("正在加载内容…");
        try {
          const file = await api(`/repos/${REPO}/contents/${CONTENT_PATH}?ref=${BRANCH}`);
          state.sha = file.sha;
          state.data = JSON.parse(b64decode(file.content));
          if (!Array.isArray(state.data.articles)) state.data.articles = [];
          renderList();
          setStatus(`已加载 ${state.data.articles.length} 篇文章，可以开始编辑。`);
        } catch (error) {
          if (error.status === 401) return logout("登录已失效，请重新登录。");
          setStatus(`加载失败：${error.message}`, "error");
        }
      }

      /* ---------- 列表与编辑 ---------- */

      function renderList() {
        const list = $("article-list");
        const articles = state.data.articles;
        $("list-count").textContent = `${articles.length} 篇`;
        list.innerHTML = "";

        for (const article of articles) {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "article-item" + (article.id === state.selectedId ? " is-selected" : "");
          button.innerHTML = `
            <span class="article-item-title">
              ${article.featured ? '<span class="badge">精选</span>' : ""}
              <span></span>
            </span>
            <p class="article-item-meta"></p>`;
          button.querySelector(".article-item-title span").textContent = article.title || article.id;
          button.querySelector(".article-item-meta").textContent = `${article.date || ""} · ${article.readTime || ""}`;
          button.addEventListener("click", () => selectArticle(article.id));
          item.append(button);
          list.append(item);
        }
      }

  function selectArticle(id) {
        if (state.dirty && !window.confirm("当前文章尚未保存，切换将丢失修改。继续？")) return;
        const article = state.data.articles.find((item) => item.id === id);
        if (!article) return;
        state.selectedId = id;
        state.dirty = false;

        $("f-title").value = article.title || "";
        $("f-title-en").value = article.titleEn || "";
        $("f-date").value = article.date || "";
        $("f-read").value = article.readTime || "";
        $("f-tags").value = (article.tags || []).join(", ");
        $("f-summary").value = article.summary || "";
        $("f-summary-en").value = article.summaryEn || "";
        $("f-body").value = article.bodyMarkdown || (article.body || []).join("\n\n");
        $("f-body-en").value = article.bodyMarkdownEn || (article.bodyEn || []).join("\n\n");
        $("f-featured").checked = Boolean(article.featured);
        resetBodyPane("f-body");
        resetBodyPane("f-body-en");

        $("editor-form").hidden = false;
        $("empty-hint").hidden = true;
        $("delete-btn").hidden = false;
        renderList();
        setStatus("正在编辑，修改后记得保存。");
      }

      function newArticle() {
        if (state.dirty && !window.confirm("当前文章尚未保存，切换将丢失修改。继续？")) return;
        state.selectedId = "";
        state.dirty = false;

        const now = new Date();
        const date = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, "0")}`;
        $("editor-form").reset();
        $("f-date").value = date;
        $("f-read").value = "5 min read";
        resetBodyPane("f-body");
        resetBodyPane("f-body-en");

        $("editor-form").hidden = false;
        $("empty-hint").hidden = true;
        $("delete-btn").hidden = true;
        renderList();
        setStatus("新文章：填写完成后保存即可发布。");
        $("f-title").focus();
      }

      const paragraphs = (value) =>
        String(value || "")
          .split(/\n\s*\n/)
          .map((p) => p.trim())
          .filter(Boolean);

      function provisionalId() {
        return (
          slugify($("f-title-en").value || $("f-title").value) ||
          `post-${Date.now()}`
        );
      }

      function collectForm() {
        const title = $("f-title").value.trim();
        const tags = $("f-tags").value.split(",").map((t) => t.trim()).filter(Boolean);
        if (!title) throw new Error("请填写中文标题。");
        if (!tags.length) throw new Error("请至少填写一个标签。");
        const bodyMarkdown = $("f-body").value.trim();
        if (!bodyMarkdown) throw new Error("请填写中文正文。");

        const article = {
          id: state.selectedId || provisionalId(),
          title,
          titleEn: $("f-title-en").value.trim(),
          date: $("f-date").value.trim(),
          readTime: $("f-read").value.trim(),
          tags,
          summary: $("f-summary").value.trim(),
          summaryEn: $("f-summary-en").value.trim(),
          bodyMarkdown,
          bodyMarkdownEn: $("f-body-en").value.trim(),
          featured: $("f-featured").checked,
        };
        if (!article.titleEn) delete article.titleEn;
        if (!article.summaryEn) delete article.summaryEn;
        if (!article.bodyMarkdownEn) delete article.bodyMarkdownEn;
        return article;
      }

      async function saveArticle(event) {
        event.preventDefault();
        let article;
        try {
          article = collectForm();
        } catch (error) {
          setStatus(error.message, "error");
          return;
        }

        const articles = state.data.articles;
        if (article.featured) articles.forEach((item) => { delete item.featured; });

        const existing = articles.findIndex((item) => item.id === article.id);
        if (existing >= 0) articles[existing] = article;
        else articles.unshift(article);

        const button = $("save-btn");
        button.disabled = true;
        setStatus("正在提交到 GitHub…");
        try {
          const result = await api(`/repos/${REPO}/contents/${CONTENT_PATH}`, {
            method: "PUT",
            body: JSON.stringify({
              message: `content: ${state.selectedId ? "更新" : "发布"}《${article.title}》`,
              content: b64encode(JSON.stringify(state.data, null, 2) + "\n"),
              sha: state.sha,
              branch: BRANCH,
            }),
          });
          state.sha = result.content.sha;
          state.selectedId = article.id;
          state.dirty = false;
          renderList();
          const line = $("status-line");
          line.dataset.kind = "success";
          line.textContent = "";
          line.append(
            document.createTextNode("已提交，站点正在自动部署（约 1 分钟）。"),
            " · ",
            Object.assign(document.createElement("a"), {
              href: `https://github.com/${REPO}/actions`,
              target: "_blank",
              rel: "noreferrer noopener",
              textContent: "部署进度",
            }),
            " · ",
            Object.assign(document.createElement("a"), {
              href: "/",
              target: "_blank",
              rel: "noreferrer noopener",
              textContent: "查看站点",
            }),
          );
        } catch (error) {
          if (error.status === 401) return logout("登录已失效，请重新登录。");
          if (error.status === 409) {
            setStatus("内容已在其他地方被更新，请点击「重新加载」后再保存。", "error");
          } else {
            setStatus(`保存失败：${error.message}`, "error");
          }
        } finally {
          button.disabled = false;
        }
      }

      async function deleteArticle() {
        if (!state.selectedId) return;
        const article = state.data.articles.find((item) => item.id === state.selectedId);
        if (!article) return;
        if (!window.confirm(`确定删除《${article.title}》？保存后将从公开站点移除。`)) return;

        state.data.articles = state.data.articles.filter((item) => item.id !== state.selectedId);
        const button = $("save-btn");
        button.disabled = true;
        setStatus("正在删除…");
        try {
          const result = await api(`/repos/${REPO}/contents/${CONTENT_PATH}`, {
            method: "PUT",
            body: JSON.stringify({
              message: `content: 删除《${article.title}》`,
              content: b64encode(JSON.stringify(state.data, null, 2) + "\n"),
              sha: state.sha,
              branch: BRANCH,
            }),
          });
          state.sha = result.content.sha;
          state.selectedId = "";
          state.dirty = false;
          $("editor-form").hidden = true;
          $("empty-hint").hidden = false;
          renderList();
          setStatus("已删除，站点将自动更新。", "success");
        } catch (error) {
          if (error.status === 401) return logout("登录已失效，请重新登录。");
          if (error.status === 409) {
            setStatus("内容已在其他地方被更新，请点击「重新加载」后再试。", "error");
          } else {
            setStatus(`删除失败：${error.message}`, "error");
          }
        } finally {
          button.disabled = false;
        }
      }

      /* ---------- 图片上传 ---------- */

      const fileToBase64 = (file) =>
        new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
          reader.onerror = () => reject(new Error("无法读取该文件。"));
          reader.readAsDataURL(file);
        });

      async function prepareImage(file) {
        if (!file.type.startsWith("image/")) throw new Error("只能上传图片文件。");
        const extByType = { "image/png": "png", "image/webp": "webp", "image/gif": "gif" };
        if (file.size <= 400 * 1024) {
          return { base64: await fileToBase64(file), ext: extByType[file.type] || "jpg" };
        }
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.86));
        if (!blob) throw new Error("图片处理失败。");
        return { base64: await fileToBase64(blob), ext: "jpg" };
      }

      function insertAtCursor(textarea, snippet) {
        const { selectionStart: start, selectionEnd: end, value } = textarea;
        textarea.value = value.slice(0, start) + snippet + value.slice(end);
        textarea.selectionStart = textarea.selectionEnd = start + snippet.length;
        textarea.focus();
        state.dirty = true;
      }

      async function uploadImageFile(file, textarea) {
        if (!state.sha) {
          setStatus("内容尚未加载完成，请稍后再试。", "error");
          return;
        }
        setStatus(`正在上传图片 ${file.name}…`);
        try {
          const { base64, ext } = await prepareImage(file);
          const articleId = state.selectedId || provisionalId();
          const cleanName = (file.name || "image")
            .replace(/\.[^.]+$/, "")
            .replace(/[^a-zA-Z0-9_-]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .slice(0, 40) || "image";
          const path = `public/assets/posts/${articleId}/${Date.now()}-${cleanName}.${ext}`;
          await api(`/repos/${REPO}/contents/${path}`, {
            method: "PUT",
            body: JSON.stringify({
              message: `content: add image for ${articleId}`,
              content: base64,
              branch: BRANCH,
            }),
          });
          insertAtCursor(textarea, `![图片说明](/${path.replace(/^public\//, "")})`);
          setStatus("图片已上传并插入正文，随文章一起发布。", "success");
        } catch (error) {
          if (error.status === 401) return logout("登录已失效，请重新登录。");
          setStatus(`图片上传失败：${error.message}`, "error");
        }
      }

      /* ---------- 正文预览 ---------- */

      function miniMarkdown(source) {
        const esc = (value) =>
          value.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const inline = (text) =>
          text
            .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
            .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>')
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/`([^`]+)`/g, "<code>$1</code>");
        return String(source || "")
          .trim()
          .split(/\n\s*\n/)
          .map((block) => {
            const trimmed = block.trim();
            if (!trimmed) return "";
            const heading = trimmed.match(/^(#{1,4})\s+(.*)$/);
            if (heading) return `<h4>${inline(esc(heading[2]))}</h4>`;
            if (/^>\s?/.test(trimmed)) {
              return `<blockquote><p>${inline(esc(trimmed.replace(/^>\s?/gm, "")))}</p></blockquote>`;
            }
            return `<p>${inline(esc(trimmed)).replace(/\n/g, "<br>")}</p>`;
          })
          .join("");
      }

      function resetBodyPane(fieldId) {
        const textarea = $(fieldId);
        const pane = $(`${fieldId}-preview`);
        const button = document.querySelector(`.tool-btn[data-body-action="preview"][data-target="${fieldId}"]`);
        if (pane) {
          pane.hidden = true;
          pane.innerHTML = "";
        }
        textarea.hidden = false;
        if (button) button.textContent = fieldId === "f-body" ? "预览" : "Preview";
      }

      function toggleBodyPreview(fieldId) {
        const textarea = $(fieldId);
        const pane = $(`${fieldId}-preview`);
        const button = document.querySelector(`.tool-btn[data-body-action="preview"][data-target="${fieldId}"]`);
        const showPreview = pane.hidden;
        if (showPreview) {
          pane.innerHTML =
            miniMarkdown(textarea.value) || "<p>暂无内容 — 先写点什么吧。</p>";
        }
        pane.hidden = !showPreview;
        textarea.hidden = showPreview;
        button.textContent = showPreview
          ? fieldId === "f-body" ? "编辑" : "Edit"
          : fieldId === "f-body" ? "预览" : "Preview";
      }

      function logout(message = "") {
        state.token = "";
        state.login = "";
        state.data = null;
        state.sha = "";
        state.selectedId = "";
        localStorage.removeItem(STORAGE_KEY);
        sessionStorage.removeItem(STORAGE_KEY);
        editorView.hidden = true;
        loginView.hidden = false;
        $("login-token").value = "";
        setLoginNotice(message);
      }

      /* ---------- 启动 ---------- */

      $("login-form").addEventListener("submit", handleLogin);
      $("logout-btn").addEventListener("click", () => logout());
      $("reload-btn").addEventListener("click", () => {
        if (state.dirty && !window.confirm("当前文章尚未保存，重新加载将丢失修改。继续？")) return;
        state.dirty = false;
        loadContent();
      });
      $("new-btn").addEventListener("click", newArticle);
      $("editor-form").addEventListener("submit", saveArticle);
      $("delete-btn").addEventListener("click", deleteArticle);

      const imageInput = $("image-input");
      document.addEventListener("click", (event) => {
        const button = event.target.closest(".tool-btn[data-body-action]");
        if (!button) return;
        const fieldId = button.dataset.target;
        if (button.dataset.bodyAction === "image") {
          imageInput.dataset.target = fieldId;
          imageInput.value = "";
          imageInput.click();
        } else if (button.dataset.bodyAction === "preview") {
          toggleBodyPreview(fieldId);
        }
      });

      imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];
        if (!file) return;
        uploadImageFile(file, $(imageInput.dataset.target || "f-body"));
      });

      for (const fieldId of ["f-body", "f-body-en"]) {
        const textarea = $(fieldId);
        textarea.addEventListener("paste", (event) => {
          const file = [...(event.clipboardData?.files || [])].find((item) =>
            item.type.startsWith("image/"),
          );
          if (!file) return;
          event.preventDefault();
          uploadImageFile(file, textarea);
        });
        textarea.addEventListener("dragover", (event) => event.preventDefault());
        textarea.addEventListener("drop", (event) => {
          const file = [...(event.dataTransfer?.files || [])].find((item) =>
            item.type.startsWith("image/"),
          );
          if (!file) return;
          event.preventDefault();
          uploadImageFile(file, textarea);
        });
      }

      document.addEventListener("input", (event) => {
        if (event.target.closest("#editor-form")) state.dirty = true;
      });

      window.addEventListener("beforeunload", (event) => {
        if (state.dirty) event.preventDefault();
      });

      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "s") {
          if (!editorView.hidden) {
            event.preventDefault();
            $("editor-form").requestSubmit();
          }
        }
      });

      const saved =
        JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "null") ||
        JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (saved?.token && saved?.login) {
        state.token = saved.token;
        state.login = saved.login;
        enterEditor();
      }
    </script>
  </body>
</html>
