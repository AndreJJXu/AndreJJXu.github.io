<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Example Demo | Junjie Xu</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #07111f;
        color: #eff6ff;
        font-family: "DM Sans", "PingFang SC", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
        line-height: 1.6;
      }
      .shell { max-width: 880px; margin: 0 auto; padding: 64px 24px 80px; }
      .back { color: #75b7ff; font-size: 13px; text-decoration: none; }
      .back:hover { text-decoration: underline; }
      .kicker {
        margin: 34px 0 10px;
        color: #9eafc4;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(30px, 5vw, 44px); line-height: 1.1; }
      .meta { margin: 14px 0 0; color: #9eafc4; font-size: 14px; }
      .stage {
        margin-top: 36px;
        padding: 48px 28px;
        border: 1px dashed rgba(117, 183, 255, 0.45);
        border-radius: 8px;
        background: rgba(117, 183, 255, 0.05);
        text-align: center;
        color: #9eafc4;
      }
      .paper {
        display: inline-block;
        margin-top: 26px;
        padding: 10px 16px;
        border: 1px solid rgba(117, 183, 255, 0.5);
        border-radius: 4px;
        color: #75b7ff;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      .paper:hover { background: rgba(117, 183, 255, 0.12); }
    </style>
  </head>
  <body>
    <div class="shell">
      <a class="back" href="/">← Back to junjiexu.github.io</a>
      <p class="kicker">Project Demo</p>
      <!-- Replace the title and meta with your demo's name, venue, and authors -->
      <h1>Demo Title Goes Here</h1>
      <p class="meta">Junjie Xu · Collaborators — Venue / Year</p>

      <!-- Replace this stage with your interactive demo: model outputs, comparison sliders, iframes, etc. -->
      <div class="stage">Demo content area — replace this block with your interactive demo.</div>

      <a class="paper" href="https://andrejjxu.github.io/#publications">Related publications ↗</a>
    </div>
  </body>
</html>
